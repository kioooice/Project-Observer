<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Project Observer</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main class="shell">
    <header class="hero" id="homeHero">
      <div>
        <p class="eyebrow">本地优先 · 项目状态</p>
        <h1>Project Observer</h1>
        <p class="subtitle">先看清项目现在是什么，再决定要不要继续开发。</p>
      </div>
      <div class="hero-badge"><span class="dot"></span><span>已启用自身监测</span></div>
    </header>

    <section class="toolbar panel" id="toolbar">
      <label>
        <span>扫描根目录</span>
        <input id="rootInput" placeholder="例如 D:\\Projects" />
      </label>
      <label class="depth-label">
        <span>扫描深度</span>
        <select id="depthSelect">
          <option value="1">1</option>
          <option value="2" selected>2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </label>
      <button id="scanBtn" type="button">扫描项目</button>
      <div id="scanMessage" class="message" aria-live="polite"></div>
    </section>

    <section class="metrics" id="metrics"></section>

    <section id="homeView">
      <div class="section-heading">
        <div>
          <p class="eyebrow">项目</p>
          <h2>项目总览</h2>
        </div>
        <span id="scanMeta" class="muted"></span>
      </div>
      <div id="projectGrid" class="project-grid"></div>
    </section>

    <section id="projectView" class="project-view" hidden></section>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
